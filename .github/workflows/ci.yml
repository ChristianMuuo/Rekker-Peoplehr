name: PeopleOS Phase 1 Enterprise CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - "phase-**"
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  verify-monorepo:
    name: TypeScript, Security & Regression Tests, Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate contract-first API clients and validators
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Commit generated API clients on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- lib/api-client-react/src/generated lib/api-zod/src/generated; then
            echo "Generated API clients are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/api-client-react/src/generated lib/api-zod/src/generated
            git commit -m "chore(api): regenerate clients from OpenAPI contract"
            git push origin "${GITHUB_REF_NAME}"
          fi

      - name: Verify generated clients are committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: Run full TypeScript strict checks
        run: pnpm run typecheck

      - name: Run API server security, payroll & HRMS regression tests
        env:
          NODE_ENV: test
          PEOPLEOS_AUTH_MODE: demo
        run: pnpm run test

      - name: Build production frontend bundle
        run: pnpm --filter "@workspace/peopleos" run build

      - name: Build production API bundle & libs
        run: pnpm run build

  verify-python-ml:
    name: Python ML Engine Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ml-engine/requirements.txt

      - name: Install Python ML dependencies
        run: pip install -r services/ml-engine/requirements.txt

      - name: Run ML engine validation & fairness suite
        run: python -m unittest services/ml-engine/tests/test_ml_engine.py -v

