name: PeopleOS Phase 1 Enterprise CI

on:
  push:
    branches:
      - main
      - "phase-**"
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  verify-monorepo:
    name: TypeScript, Security & Regression Tests, Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full TypeScript strict checks
        run: pnpm run typecheck

      - name: Run API server security, payroll & HRMS regression tests
        env:
          NODE_ENV: test
          PEOPLEOS_AUTH_MODE: demo
        run: pnpm run test

      - name: Build production frontend bundle
        run: pnpm --filter "@workspace/peopleos" run build

      - name: Build production API bundle & libs
        run: pnpm run build

  verify-postgres-migrations:
    name: PostgreSQL Migration Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peopleos
          POSTGRES_PASSWORD: peopleos_test_password
          POSTGRES_DB: peopleos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peopleos -d peopleos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap core PostgreSQL schema from Drizzle
        env:
          DATABASE_URL: postgres://peopleos:peopleos_test_password@127.0.0.1:5432/peopleos_test
        run: pnpm --filter @workspace/db run push

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply additive SQL migrations in order
        env:
          PGPASSWORD: peopleos_test_password
        run: |
          set -euo pipefail
          for migration in lib/db/migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U peopleos -d peopleos_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify leave and audit tables exist
        env:
          PGPASSWORD: peopleos_test_password
        run: |
          psql -h 127.0.0.1 -U peopleos -d peopleos_test -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.peopleos_leave_ledger'), to_regclass('public.peopleos_leave_approvals'), to_regclass('public.peopleos_public_holidays'), to_regclass('public.peopleos_audit_events');"

  verify-python-ml:
    name: Python ML Engine Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ml-engine/requirements.txt

      - name: Install Python ML dependencies
        run: pip install -r services/ml-engine/requirements.txt

      - name: Run ML engine validation & fairness suite
        run: python -m unittest services/ml-engine/tests/test_ml_engine.py -v

